<title>Import Shipment Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: import bar -> filter panel -> KPI row -> two charts -> sortable table with export toolbar */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#e8ecea; --line:#d5dcd9;
  --ink:#17211f; --ink-2:#52605c; --accent:#0e6b63; --accent-ink:#ffffff; --accent-soft:#d9ece9;
  --warn:#a85d00; --warn-soft:#f8e8d0; --bad:#b3261e; --good:#1f7a3d;
  --c1:#0e6b63; --c2:#c77d12; --c3:#3b6ea8; --c4:#8a5a9e; --c5:#6b7b3a; --c6:#b85450;
  --font-ui:'IBM Plex Sans Thai',system-ui,'Noto Sans Thai',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --surface:#162120; --surface-2:#1d2b29; --line:#2b3c39;
    --ink:#e6efed; --ink-2:#9db0ab; --accent:#4fc1b5; --accent-ink:#0a1412; --accent-soft:#1b3a37;
    --warn:#e3a04a; --warn-soft:#3a2c14; --bad:#e8847d; --good:#6fcf8f;
    --c1:#4fc1b5; --c2:#e3a04a; --c3:#7fa8dc; --c4:#c49ad6; --c5:#a9b96a; --c6:#e08a86;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface-2:#1d2b29; --line:#2b3c39;
  --ink:#e6efed; --ink-2:#9db0ab; --accent:#4fc1b5; --accent-ink:#0a1412; --accent-soft:#1b3a37;
  --warn:#e3a04a; --warn-soft:#3a2c14; --bad:#e8847d; --good:#6fcf8f;
  --c1:#4fc1b5; --c2:#e3a04a; --c3:#7fa8dc; --c4:#c49ad6; --c5:#a9b96a; --c6:#e08a86;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:14px; line-height:1.5;
  padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:14px;font-weight:600;margin:0}
.muted{color:var(--ink-2)}
.mono{font-family:var(--font-mono);font-size:12.5px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.top p{margin:4px 0 0;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}

.drop{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  border:1.5px dashed var(--line);border-radius:6px;padding:14px 16px;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .info{min-width:0;flex:1 1 280px}
.drop .info b{display:block;overflow-wrap:anywhere}
.drop .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}

.badge{display:inline-block;border-radius:4px;padding:2px 8px;font-size:12px;background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}

.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink-2)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:7px 9px;min-width:0}
.field.wide{grid-column:span 2}
.fbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12px;color:var(--ink-2)}

.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.chead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.chead .ctl{display:flex;flex-wrap:wrap;gap:8px}
.chead select{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:4px 8px}
.cbox{position:relative;height:300px}

.tbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tbar .acts{display:flex;flex-wrap:wrap;gap:8px}
.tscroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--surface-2);font-weight:500;cursor:pointer;user-select:none;z-index:1}
th:hover{color:var(--accent)}
th .ar{color:var(--accent);margin-left:4px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.id{font-family:var(--font-mono);font-size:12.5px}
tbody tr:hover{background:var(--accent-soft)}
td.issue{color:var(--warn);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
.empty{padding:32px;text-align:center;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:5px;max-width:90vw;z-index:20}
.toast[hidden]{display:none}
@media (max-width:520px){.field.wide{grid-column:span 1}.cbox{height:260px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Import Shipment Tracker</h1>
      <p class="muted">นำเข้าไฟล์ Excel ของ Job นำเข้า กรองตามช่วงวันที่หรือเลข Invoice ดูกราฟสรุป แล้ว export รายงานได้ ไฟล์ถูกอ่านในเบราว์เซอร์ของคุณเท่านั้น ไม่มีการอัปโหลดไปเก็บที่ใด</p>
    </div>
  </div>

  <div class="drop" id="drop">
    <div class="info">
      <b id="srcName">ยังไม่ได้นำเข้าไฟล์</b>
      <span class="muted" id="srcNote"></span>
    </div>
    <div class="acts">
      <select id="sheetSel" aria-label="เลือกชีต" hidden></select>
      <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv" hidden>
      <button class="btn primary" id="pick" type="button">เลือกไฟล์ Excel</button>
    </div>
  </div>

  <section class="panel" aria-label="ตัวกรอง">
    <div class="filters">
      <div class="field"><label for="dateField">กรองตามวันที่ของ</label><select id="dateField"></select></div>
      <div class="field"><label for="dFrom">ตั้งแต่วันที่</label><input type="date" id="dFrom"></div>
      <div class="field"><label for="dTo">ถึงวันที่</label><input type="date" id="dTo"></div>
      <div class="field wide"><label for="q">Job / Invoice No / เลขตู้ / Seal (ใส่หลายค่าคั่นด้วย , หรือเว้นวรรคได้)</label><input type="search" id="q" placeholder="เช่น INV-26-0412, INV-26-0413"></div>
      <div class="field"><label for="fOrigin">Origin</label><select id="fOrigin"></select></div>
      <div class="field"><label for="fPort">Release Port</label><select id="fPort"></select></div>
      <div class="field"><label for="fCarrier">Carrier</label><select id="fCarrier"></select></div>
      <div class="field"><label for="fSize">Container Size</label><select id="fSize"></select></div>
      <div class="field"><label for="fStatus">Status Declaration</label><select id="fStatus"></select></div>
      <div class="field"><label for="fPlace">Delivery Place</label><select id="fPlace"></select></div>
      <div class="field"><label for="fIssue">เอกสารผิดรอแก้ไข</label>
        <select id="fIssue"><option value="">ทั้งหมด</option><option value="1">มีปัญหารอแก้ไข</option><option value="0">ไม่มีปัญหา</option></select></div>
    </div>
    <div class="fbar">
      <span class="muted" id="fcount"></span>
      <button class="btn" id="reset" type="button">ล้างตัวกรอง</button>

  <section class="kpis" id="kpis" aria-label="สรุป"></section>

  <section class="charts" aria-label="กราฟ">
    <div class="panel">
      <div class="chead">
        <h2>แนวโน้มรายเดือน</h2>
        <div class="ctl">
          <select id="c1metric" aria-label="ค่าที่แสดง">
            <option value="jobs">จำนวน Job</option>
            <option value="cartons">Cartons</option>
            <option value="cbm">CBM</option>
            <option value="ctnr">จำนวนตู้</option>
          </select>
          <select id="c1field" aria-label="แบ่งเดือนตามวันที่"></select>
          <button class="btn" id="c1png" type="button">บันทึก PNG</button>
        </div>
      </div>
      <div class="cbox"><canvas id="chart1" role="img" aria-label="กราฟแท่งรายเดือน"></canvas></div>
    </div>
    <div class="panel">
      <div class="chead">
        <h2>แยกตามกลุ่ม</h2>
        <div class="ctl">
          <select id="c2metric" aria-label="ค่าที่แสดง">
            <option value="jobs">จำนวน Job</option>
            <option value="cartons">Cartons</option>
            <option value="cbm">CBM</option>
            <option value="ctnr">จำนวนตู้</option>
          </select>
          <select id="c2group" aria-label="แบ่งตาม"></select>
          <button class="btn" id="c2png" type="button">บันทึก PNG</button>
        </div>
      </div>
      <div class="cbox"><canvas id="chart2" role="img" aria-label="กราฟแท่งแยกตามกลุ่ม"></canvas></div>
    </div>
  </section>

  <section class="panel" aria-label="ตารางข้อมูล">
    <div class="tbar">
      <h2>รายการ <span class="muted" id="tcount"></span></h2>
      <div class="acts">
        <button class="btn primary" id="expXlsx" type="button">Export Excel (รายงาน)</button>
        <button class="btn" id="expCsv" type="button">Export CSV</button>
      </div>
    </div>
    <div class="tscroll"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <div class="pager">
      <span class="muted" id="pinfo"></span>
      <button class="btn" id="prev" type="button">ก่อนหน้า</button>
      <button class="btn" id="next" type="button">ถัดไป</button>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);

/* ---------- Column definitions (matched by header text, order-insensitive) ---------- */
const COLS = [
  {k:'job',   l:'Job ID',            t:'id',   m:n=>n.startsWith('job')},
  {k:'eta',   l:'ETA',               t:'date', m:n=>n==='eta'},
  {k:'ata',   l:'ATA',               t:'date', m:n=>n==='ata'},
  {k:'inv',   l:'Invoice No',        t:'id',   m:n=>n.includes('invoice')},
  {k:'origin',l:'Origin',            t:'text', m:n=>n.includes('origin')},
  {k:'port',  l:'Release Port',      t:'text', m:n=>n.includes('releaseport')},
  {k:'carrier',l:'Carrier',          t:'text', m:n=>n.includes('carrier')},
  {k:'cnt',   l:'จำนวนตู้',           t:'num',  m:n=>n.includes('ctnrnocount')||(n.includes('ctnr')&&n.includes('count'))},
  {k:'ctnr',  l:'CTNR NO.',          t:'id',   m:n=>n.includes('ctnrno')||n.startsWith('ctnr')||n.startsWith('container')&&!n.includes('size')},
  {k:'seal',  l:'Seal',              t:'id',   m:n=>n.includes('seal')},
  {k:'size',  l:'Container Size',    t:'text', m:n=>n.includes('containersize')},
  {k:'cartons',l:'Cartons',          t:'num',  m:n=>n.includes('carton')},
  {k:'cbm',   l:'CBM',               t:'num',  m:n=>n==='cbm'},
  {k:'fileDate',l:'FileNameDate',    t:'date', m:n=>n.includes('filename')},
  {k:'doRel', l:'DO Release',        t:'date', m:n=>n.includes('dorelease')},
  {k:'docRecv',l:'Shipping Doc Receive',   t:'date', m:n=>n.includes('shippingdocumentreceive')},
  {k:'docIssue',l:'Doc Issue Reason',      t:'text', m:n=>n.includes('issuereason')},
  {k:'docDone',l:'Shipping Doc Complete',  t:'date', m:n=>n.includes('shippingdocumentcomplete')},
  {k:'status',l:'Status Declaration',t:'text', m:n=>n.includes('statusdeclaration')},
  {k:'cust',  l:'Customs Release (0209)', t:'date', m:n=>n.includes('0209')||n.includes('customsrele')},
  {k:'plan',  l:'Delivery Plan',     t:'date', m:n=>n.includes('deliveryplan')},
  {k:'imp',   l:'Import Declaration Release (0309)', t:'date', m:n=>n.includes('0309')||n.includes('importdeclerationrele')||n.includes('importdeclarationrele')},
  {k:'delDate',l:'Delivery Date (Customs)', t:'date', m:n=>n.includes('deliverydate')},
  {k:'place', l:'Delivery Place',    t:'text', m:n=>n.includes('deliveryplace')}
];
const BYKEY = Object.fromEntries(COLS.map(c=>[c.k,c]));
const DATE_KEYS = COLS.filter(c=>c.t==='date').map(c=>c.k);
const NUMF = new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const INTF = new Intl.NumberFormat('en-US');

const norm = s => String(s==null?'':s).toLowerCase().replace(/[^a-z0-9฀-๿]/g,'');

function matchHeaders(row){
  const map = {}, used = new Set();
  row.forEach((h,i)=>{
    const n = norm(h); if(!n) return;
    for(const c of COLS){
      if(used.has(c.k)) continue;
      if(c.m(n)){ map[i]=c.k; used.add(c.k); break; }
    }
  });
  return {map, score:used.size};
}

/* ---------- Value parsers ---------- */
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const pad = n => String(n).padStart(2,'0');
function iso(y,m,d){
  if(y<100) y+=2000; if(y>2400) y-=543;
  const dt = new Date(Date.UTC(y,m-1,d));
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d) return '';
  return y+'-'+pad(m)+'-'+pad(d);
}
function parseDate(v){
  if(v==null||v==='') return '';
  if(v instanceof Date && !isNaN(v)) return iso(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'){
    if(v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return iso(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());}
    return '';
  }
  const s = String(v).trim(); let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return iso(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))) return iso(+m[3],+m[2],+m[1]);
  if((m=s.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3})[a-z]*[\s\-\/,]*(\d{2,4})/))){
    const mo=MON[m[2].toLowerCase()]; if(mo) return iso(+m[3],mo,+m[1]);
  }
  return '';
}
function parseNum(v){
  if(typeof v==='number') return v;
  if(v==null||v==='') return null;
  const x = parseFloat(String(v).replace(/,/g,'')); return isNaN(x)?null:x;
}
function fmtDate(s){ return s? s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : ''; }
function daysBetween(a,b){ return (Date.parse(b)-Date.parse(a))/864e5; }

/* ---------- Build rows from a worksheet ---------- */
function analyseSheet(ws){
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  let best = {score:0,i:-1,map:{}};
  for(let i=0;i<Math.min(rows.length,20);i++){
    const r = matchHeaders(rows[i]);
    if(r.score>best.score) best = {score:r.score,i,map:r.map};
  }
  return {rows,best};
}
function rowsFromSheet(an){
  const out = [];
  for(let i=an.best.i+1;i<an.rows.length;i++){
    const r = an.rows[i], o = {};
    let any = false;
    for(const idx in an.best.map){
      const k = an.best.map[idx], c = BYKEY[k], v = r[idx];
      if(c.t==='date') o[k]=parseDate(v);
      else if(c.t==='num') o[k]=parseNum(v);
      else o[k]=(v==null?'':String(v).trim());
      if(o[k]!==''&&o[k]!==null) any = true;
    }
    if(!any||(!o.job&&!o.inv&&!o.ctnr)) continue;
    COLS.forEach(c=>{ if(!(c.k in o)) o[c.k]=c.t==='num'?null:''; });
    out.push(o);
  }
  return out;
}

/* ---------- State ---------- */
let ALL = [], VIEW = [], sortKey = null, sortDir = 1, page = 0;
const PAGE = 50;
const GROUPS = ['origin','port','carrier','size','status','place'];
const SELECT_FILTERS = {fOrigin:'origin', fPort:'port', fCarrier:'carrier', fSize:'size', fStatus:'status', fPlace:'place'};

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 3500);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Controls ---------- */
function fillSelect(id, vals, allLabel){
  const el = $(id), cur = el.value;
  el.innerHTML = '<option value="">'+allLabel+'</option>' + vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
  if(vals.includes(cur)) el.value = cur;
}
function initStaticControls(){
  const dopts = DATE_KEYS.map(k=>'<option value="'+k+'">'+esc(BYKEY[k].l)+'</option>').join('');
  $('dateField').innerHTML = dopts; $('dateField').value = 'eta';
  $('c1field').innerHTML = dopts;   $('c1field').value = 'eta';
  $('c2group').innerHTML = GROUPS.map(k=>'<option value="'+k+'">'+esc(BYKEY[k].l)+'</option>').join('');
}
function refreshFilterOptions(){
  for(const id in SELECT_FILTERS){
    const k = SELECT_FILTERS[id];
    const vals = [...new Set(ALL.map(r=>r[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    fillSelect(id, vals, 'ทั้งหมด');
  }
}

/* ---------- Filtering & sorting ---------- */
function applyFilters(){
  const f = $('dateField').value, from = $('dFrom').value, to = $('dTo').value;
  const toks = $('q').value.toLowerCase().split(/[\s,;]+/).filter(Boolean);
  const sel = {}; for(const id in SELECT_FILTERS) sel[SELECT_FILTERS[id]] = $(id).value;
  const issue = $('fIssue').value;
  VIEW = ALL.filter(r=>{
    if(from||to){
      const d = r[f]; if(!d) return false;
      if(from && d<from) return false;
      if(to && d>to) return false;
    }
    if(toks.length){
      const hay = (r.job+' '+r.inv+' '+r.ctnr+' '+r.seal).toLowerCase();
      if(!toks.some(t=>hay.includes(t))) return false;
    }
    for(const k in sel) if(sel[k] && r[k]!==sel[k]) return false;
    if(issue==='1' && !r.docIssue) return false;
    if(issue==='0' && r.docIssue) return false;
    return true;
  });
  if(sortKey) sortView();
  page = 0;
  renderAll();
}
function sortView(){
  const k = sortKey, num = BYKEY[k].t==='num';
  VIEW.sort((a,b)=>{
    const x=a[k], y=b[k], ex=(x===''||x==null), ey=(y===''||y==null);
    if(ex&&ey) return 0; if(ex) return 1; if(ey) return -1;
    const c = num ? x-y : String(x).localeCompare(String(y),undefined,{numeric:true});
    return c*sortDir;
  });
}

/* ---------- Aggregation helpers (shared by KPIs, charts, export) ---------- */
function metric(r, m){
  if(m==='jobs') return 1;
  if(m==='cartons') return r.cartons||0;
  if(m==='cbm') return r.cbm||0;
  return r.cnt!=null ? r.cnt : (r.ctnr?1:0);
}
const METRIC_LABEL = {jobs:'จำนวน Job', cartons:'Cartons', cbm:'CBM', ctnr:'จำนวนตู้'};
function groupBy(rows, keyFn, m){
  const g = new Map();
  rows.forEach(r=>{ const k = keyFn(r); if(!k) return; g.set(k,(g.get(k)||0)+metric(r,m)); });
  return g;
}

/* ---------- KPIs ---------- */
function renderKpis(){
  const n = VIEW.length;
  const sum = m => VIEW.reduce((a,r)=>a+metric(r,m),0);
  const issues = VIEW.filter(r=>r.docIssue).length;
  const lt = VIEW.filter(r=>r.ata&&r.delDate).map(r=>daysBetween(r.ata,r.delDate));
  const avg = lt.length ? lt.reduce((a,b)=>a+b,0)/lt.length : null;
  const items = [
    ['Job ที่แสดง', INTF.format(n), 'จากทั้งหมด '+INTF.format(ALL.length)],
    ['จำนวนตู้', INTF.format(sum('ctnr')), ''],
    ['Cartons', INTF.format(sum('cartons')), ''],
    ['CBM', NUMF.format(sum('cbm')), ''],
    ['เอกสารรอแก้ไข', INTF.format(issues), n? NUMF.format(issues/n*100)+'% ของ Job':''],
    ['เฉลี่ย ATA ถึงส่งมอบ', avg==null?'-':NUMF.format(avg)+' วัน', lt.length+' Job ที่มีทั้งสองวันที่']
  ];
  $('kpis').innerHTML = items.map(i=>'<div class="kpi"><div class="l">'+i[0]+'</div><div class="v">'+i[1]+'</div><div class="s">'+esc(i[2])+'&nbsp;</div></div>').join('');
}

/* ---------- Table ---------- */
function renderTable(){
  const head = '<tr>'+COLS.map(c=>{
    const ar = sortKey===c.k ? '<span class="ar">'+(sortDir>0?'▲':'▼')+'</span>' : '';
    return '<th class="'+(c.t==='num'?'n':'')+'" data-k="'+c.k+'" tabindex="0" title="คลิกเพื่อเรียง">'+esc(c.l)+ar+'</th>';
  }).join('')+'</tr>';
  $('tbl').tHead.innerHTML = head;
  const total = VIEW.length, pages = Math.max(1,Math.ceil(total/PAGE));
  if(page>=pages) page = pages-1;
  const slice = VIEW.slice(page*PAGE,(page+1)*PAGE);
  if(!slice.length){
    $('tbl').tBodies[0].innerHTML = '<tr><td colspan="'+COLS.length+'" class="empty">'+(ALL.length?'ไม่พบรายการตามตัวกรองนี้':'ยังไม่มีข้อมูล กด "เลือกไฟล์ Excel" เพื่อนำเข้า')+'</td></tr>';
  } else {
    $('tbl').tBodies[0].innerHTML = slice.map(r=>'<tr>'+COLS.map(c=>{
      const v = r[c.k]; let txt, cls = '';
      if(c.t==='date') txt = fmtDate(v);
      else if(c.t==='num'){ txt = v==null?'':NUMF.format(v); cls='n'; }
      else { txt = v; if(c.t==='id') cls='id'; }
      if(c.k==='docIssue' && v) cls += ' issue';
      return '<td class="'+cls+'"'+(c.k==='docIssue'&&v?' title="'+esc(v)+'"':'')+'>'+esc(txt)+'</td>';
    }).join('')+'</tr>').join('');
  }
  $('tcount').textContent = '('+INTF.format(total)+' รายการ)';
  $('pinfo').textContent = total ? 'หน้า '+(page+1)+' / '+pages : '';
  $('prev').disabled = page<=0; $('next').disabled = page>=pages-1;
  $('fcount').textContent = 'แสดง '+INTF.format(total)+' จาก '+INTF.format(ALL.length)+' รายการ';
}

/* ---------- Charts ---------- */
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const bgPlugin = {id:'bg', beforeDraw(ch){
  const c = ch.ctx; c.save(); c.globalCompositeOperation='destination-over';
  c.fillStyle = cssv('--surface'); c.fillRect(0,0,ch.width,ch.height); c.restore();
}};
function drawChart(canvasId, labels, data, color, horizontal, label){
  if(typeof Chart==='undefined') return;
  const cv = $(canvasId), ink2 = cssv('--ink-2'), line = cssv('--line');
  const old = Chart.getChart(cv); if(old) old.destroy();
  Chart.defaults.font.family = cssv('--font-ui');
  Chart.defaults.color = ink2;
  new Chart(cv, {
    type:'bar',
    data:{labels, datasets:[{label, data, backgroundColor:cssv(color), borderRadius:2, maxBarThickness:36}]},
    options:{
      indexAxis: horizontal?'y':'x', responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>' '+label+': '+NUMF.format(c.parsed[horizontal?'x':'y'])}}},
      scales:{
        x:{grid:{color:horizontal?line:'transparent'}, ticks:{color:ink2}, beginAtZero:true},
        y:{grid:{color:horizontal?'transparent':line}, ticks:{color:ink2}, beginAtZero:true}
      }
    },
    plugins:[bgPlugin]
  });
}
function renderCharts(){
  const m1 = $('c1metric').value, f1 = $('c1field').value;
  const g1 = groupBy(VIEW, r=>r[f1]&&r[f1].slice(0,7), m1);
  const ks = [...g1.keys()].sort();
  drawChart('chart1', ks.map(k=>k.slice(5)+'/'+k.slice(0,4)), ks.map(k=>Math.round(g1.get(k)*100)/100), '--c1', false, METRIC_LABEL[m1]);
  const m2 = $('c2metric').value, gk = $('c2group').value;
  const g2 = groupBy(VIEW, r=>r[gk], m2);
  const top = [...g2.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12);
  drawChart('chart2', top.map(e=>e[0]), top.map(e=>Math.round(e[1]*100)/100), '--c2', true, METRIC_LABEL[m2]);
}
function savePng(id, name){
  $(id).toBlob(b=>{ if(b) saveFile(name+'.png', b); else toast('สร้างรูปไม่สำเร็จ'); });
}

/* ---------- Saving files ---------- */
async function saveFile(name, data){
  let dl = null;
  try { dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch(e){ dl = null; }
  if(dl){
    try { await dl.save({filename:name, data}); toast('บันทึกไฟล์แล้ว: '+name); }
    catch(e){ toast(e && e.code==='declined' ? 'ยกเลิกการบันทึก' : 'บันทึกไม่สำเร็จ ('+((e&&e.code)||'error')+')'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('ดาวน์โหลด: '+name);
}
function stamp(){ const d=new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes()); }

/* ---------- Export ---------- */
function filterText(){
  const out = [];
  const f = $('dateField').value, a = $('dFrom').value, b = $('dTo').value;
  if(a||b) out.push(BYKEY[f].l+': '+(a?fmtDate(a):'...')+' ถึง '+(b?fmtDate(b):'...'));
  if($('q').value.trim()) out.push('ค้นหา: '+$('q').value.trim());
  for(const id in SELECT_FILTERS){ const v=$(id).value; if(v) out.push(BYKEY[SELECT_FILTERS[id]].l+': '+v); }
  if($('fIssue').value) out.push('เอกสารรอแก้ไข: '+($('fIssue').value==='1'?'มี':'ไม่มี'));
  return out.length ? out.join(' | ') : 'ไม่มี (ทั้งหมด)';
}
function localDate(s){ return new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)); }
function statTable(keyFn){
  const g = new Map();
  VIEW.forEach(r=>{
    const k = keyFn(r); if(!k) return;
    const o = g.get(k)||{jobs:0,ctnr:0,cartons:0,cbm:0};
    o.jobs++; o.ctnr+=metric(r,'ctnr'); o.cartons+=r.cartons||0; o.cbm+=r.cbm||0;
    g.set(k,o);
  });
  return [...g.entries()];
}
function exportXlsx(){
  if(typeof XLSX==='undefined'){ toast('โหลดไลบรารี Excel ไม่สำเร็จ'); return; }
  if(!VIEW.length){ toast('ไม่มีข้อมูลให้ export'); return; }
  // Sheet 1: filtered data with real Excel dates
  const aoa = [COLS.map(c=>c.l)];
  VIEW.forEach(r=>aoa.push(COLS.map(c=>{
    const v = r[c.k];
    if(c.t==='date') return v ? localDate(v) : '';
    return v==null?'':v;
  })));
  const ws1 = XLSX.utils.aoa_to_sheet(aoa,{cellDates:true});
  COLS.forEach((c,ci)=>{
    if(c.t!=='date') return;
    for(let r=1;r<aoa.length;r++){
      const cell = ws1[XLSX.utils.encode_cell({r,c:ci})];
      if(cell && cell.t==='d') cell.z = 'dd/mm/yyyy';
    }
  });
  ws1['!cols'] = COLS.map(c=>({wch: c.t==='date'?14: Math.max(12,Math.min(30,c.l.length+2))}));
  ws1['!freeze'] = {xSplit:0,ySplit:1};
  // Sheet 2: summary
  const f1 = $('c1field').value;
  const S = [
    ['รายงานสรุป Import Shipment'],
    ['สร้างเมื่อ', new Date().toLocaleString('th-TH')],
    ['ไฟล์ต้นทาง', $('srcName').textContent],
    ['เงื่อนไขกรอง', filterText()],
    [],
    ['ตัวชี้วัด','ค่า'],
    ['จำนวน Job', VIEW.length],
    ['จำนวนตู้', VIEW.reduce((a,r)=>a+metric(r,'ctnr'),0)],
    ['Cartons', VIEW.reduce((a,r)=>a+(r.cartons||0),0)],
    ['CBM', Math.round(VIEW.reduce((a,r)=>a+(r.cbm||0),0)*100)/100],
    ['เอกสารรอแก้ไข (Job)', VIEW.filter(r=>r.docIssue).length],
    []
  ];
  const block = (title, rows) => {
    S.push([title]); S.push(['กลุ่ม','Job','จำนวนตู้','Cartons','CBM']);
    rows.forEach(([k,o])=>S.push([k,o.jobs,o.ctnr,o.cartons,Math.round(o.cbm*100)/100]));
    S.push([]);
  };
  block('รายเดือน (ตาม '+BYKEY[f1].l+')', statTable(r=>r[f1]&&r[f1].slice(0,7)).sort((a,b)=>a[0].localeCompare(b[0])));
  GROUPS.forEach(g=>block('แยกตาม '+BYKEY[g].l, statTable(r=>r[g]).sort((a,b)=>b[1].jobs-a[1].jobs)));
  const ws2 = XLSX.utils.aoa_to_sheet(S);
  ws2['!cols'] = [{wch:30},{wch:14},{wch:14},{wch:14},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws2, 'สรุป');
  XLSX.utils.book_append_sheet(wb, ws1, 'ข้อมูลที่กรอง');
  const buf = XLSX.write(wb, {bookType:'xlsx', type:'array', cellDates:true});
  saveFile('shipment-report-'+stamp()+'.xlsx', new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
function exportCsv(){
  if(!VIEW.length){ toast('ไม่มีข้อมูลให้ export'); return; }
  const q = v => { const s = String(v==null?'':v); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [COLS.map(c=>q(c.l)).join(',')];
  VIEW.forEach(r=>lines.push(COLS.map(c=>q(c.t==='date'?fmtDate(r[c.k]):r[c.k])).join(',')));
  saveFile('shipment-data-'+stamp()+'.csv', new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
}

/* ---------- Import ---------- */
let WB = null;
function setSource(name, note, ok){
  $('srcName').textContent = name;
  $('srcNote').innerHTML = (ok?'<span class="badge ok">นำเข้าแล้ว</span> ':'')+esc(note);
}
function loadRows(rows, name, note, ok){
  ALL = rows;
  ['dFrom','dTo','q'].forEach(id=>{ $(id).value=''; });
  for(const id in SELECT_FILTERS) $(id).value='';
  $('fIssue').value='';
  refreshFilterOptions();
  setSource(name, note, ok);
  sortKey = null; applyFilters();
}
function loadSheet(name, fileName){
  const an = analyseSheet(WB.Sheets[name]);
  if(an.best.score<3){
    toast('ไม่พบหัวคอลัมน์ที่รู้จักในชีต "'+name+'" ตรวจสอบว่าแถวหัวตารางมีชื่อเช่น Job, ETA, Invoice No');
    return false;
  }
  const rows = rowsFromSheet(an);
  const found = Object.values(an.best.map);
  const missing = COLS.filter(c=>!found.includes(c.k)).map(c=>c.l);
  loadRows(rows, fileName, 'ชีต "'+name+'" · '+INTF.format(rows.length)+' แถว · พบ '+found.length+' จาก '+COLS.length+' คอลัมน์'+(missing.length?' · ไม่พบ: '+missing.join(', '):''), true);
  return true;
}
function handleFile(file){
  if(!file) return;
  const isCsv = /\.csv$/i.test(file.name);
  const rd = new FileReader();
  rd.onerror = () => toast('อ่านไฟล์ไม่สำเร็จ');
  rd.onload = () => {
    try{
      WB = XLSX.read(rd.result, {type: isCsv?'string':'array'});
    }catch(e){ toast('เปิดไฟล์ไม่ได้ รองรับ .xlsx .xls .csv'); return; }
    let bestName = null, bestScore = -1;
    WB.SheetNames.forEach(n=>{ const s = analyseSheet(WB.Sheets[n]).best.score; if(s>bestScore){bestScore=s;bestName=n;} });
    const sel = $('sheetSel');
    sel.innerHTML = WB.SheetNames.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');
    sel.value = bestName; sel.hidden = WB.SheetNames.length<2;
    sel.dataset.file = file.name;
    loadSheet(bestName, file.name);
  };
  if(isCsv) rd.readAsText(file,'UTF-8'); else rd.readAsArrayBuffer(file);
}

/* ---------- Wiring ---------- */
function renderAll(){ renderKpis(); renderTable(); renderCharts(); }
let qT; $('q').addEventListener('input',()=>{ clearTimeout(qT); qT=setTimeout(applyFilters,180); });
['dateField','dFrom','dTo','fIssue',...Object.keys(SELECT_FILTERS)].forEach(id=>$(id).addEventListener('change',applyFilters));
['c1metric','c1field','c2metric','c2group'].forEach(id=>$(id).addEventListener('change',renderCharts));
$('reset').addEventListener('click',()=>{
  ['dFrom','dTo','q'].forEach(id=>{ $(id).value=''; });
  for(const id in SELECT_FILTERS) $(id).value='';
  $('fIssue').value=''; $('dateField').value='eta'; applyFilters();
});
$('tbl').tHead.addEventListener('click',e=>{
  const th = e.target.closest('th'); if(!th) return;
  const k = th.dataset.k; if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=1; }
  sortView(); page=0; renderTable();
});
$('tbl').tHead.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.target.click(); } });
$('prev').addEventListener('click',()=>{ page--; renderTable(); });
$('next').addEventListener('click',()=>{ page++; renderTable(); });
$('expXlsx').addEventListener('click',exportXlsx);
$('expCsv').addEventListener('click',exportCsv);
$('c1png').addEventListener('click',()=>savePng('chart1','chart-monthly-'+stamp()));
$('c2png').addEventListener('click',()=>savePng('chart2','chart-group-'+stamp()));
$('pick').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{ handleFile(e.target.files[0]); e.target.value=''; });
$('sheetSel').addEventListener('change',e=>loadSheet(e.target.value, e.target.dataset.file||''));
const dz = $('drop');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.add('over'); }));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop',e=>handleFile(e.dataTransfer.files[0]));
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());

// Recolor charts when the theme changes
const mq = window.matchMedia('(prefers-color-scheme: dark)');
(mq.addEventListener ? mq.addEventListener.bind(mq,'change') : mq.addListener.bind(mq))(()=>renderCharts());
new MutationObserver(()=>renderCharts()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- Start empty ---------- */
initStaticControls();
loadRows([],'ยังไม่ได้นำเข้าไฟล์','เลือกไฟล์ Excel (.xlsx, .xls, .csv) หรือลากมาวางที่นี่',false);
})();
</script>
